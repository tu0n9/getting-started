name: Deploy Application

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch: # Cho phép chạy thủ công từ tab Actions trên GitHub

jobs:
  build-and-deploy:
    name: Build & Push Docker Image
    runs-on: self-hosted
    steps:
      # 1. Checkout source code từ repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Thiết lập QEMU (hỗ trợ build multi-architecture nếu cần)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 3. Thiết lập Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Đăng nhập vào Docker Hub (Sử dụng GitHub Secrets)
      # Lưu ý: Bạn cần cấu hình DOCKER_USERNAME và DOCKER_PASSWORD trong Settings -> Secrets của Repository
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5. Build và Push Docker Image
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/getting-started-app:latest
            ${{ secrets.DOCKER_USERNAME }}/getting-started-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

